<section>
  <h1>Users</h1>
  @if (users.isLoading()) {
    <forge-spinner />
  } @else if (users.hasValue()) {
    @defer {
      <table>
        <thead>
          <tr><th>Name</th><th>Email</th><th>Role</th><th>Assigned</th></tr>
        </thead>
        <tbody>
          @for (u of users.value(); track u.id) {
            <tr>
              <td>{{ u.name }}</td>
              <td>{{ u.email }}</td>
              <td><forge-badge>{{ u.role }}</forge-badge></td>
              <td>{{ u.issueCount }}</td>
            </tr>
          } @empty {
            <tr><td colspan="4"><forge-empty-state title="No users" /></td></tr>
          }
        </tbody>
      </table>
    }
  }
</section>
