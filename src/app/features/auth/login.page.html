<main>
  <section>
    <p class="eyebrow">IssueForge</p>
    <h1>Sign in</h1>
    <p class="muted">Mock auth. Pick a demo account or use the form.</p>

    <form (submit)="submit($event)">
      <forge-text-field label="Email">
        <input type="email" autocomplete="username" [formField]="loginForm.email" />
      </forge-text-field>
      <forge-text-field label="Password">
        <input type="password" autocomplete="current-password" [formField]="loginForm.password" />
      </forge-text-field>
      @if (error) {
        <p class="error">{{ error }}</p>
      }
      <forge-button variant="primary" type="submit" [disabled]="!loginForm().valid()" [block]="true">
        Sign in
      </forge-button>
    </form>

    <aside>
      <h2>Demo accounts</h2>
      <ul>
        <li><code>ada@board.dev</code> — admin</li>
        <li><code>linus@board.dev</code> — member</li>
        <li><code>grace@board.dev</code> — viewer</li>
      </ul>
      <p>Password for all: <code>password</code></p>
    </aside>
  </section>
</main>
